name: Security validation

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.15.0"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1"

jobs:
  secrets:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            "${GITLEAKS_IMAGE}" detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --verbose \
            --no-banner

      - name: Write secret-scan summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Secret Scan"
            echo
            echo "- Scanner: ${GITLEAKS_IMAGE}"
            echo "- Repository history/current content scan completed."
          } >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Dependency security scans
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create report directory
        run: mkdir -p reports/security

      - name: Python dependency audit
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit \
            -r backend/requirements-runtime.txt \
            -r backend/requirements-dev.txt \
            --format json \
            --output reports/security/pip-audit.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=critical --omit=optional --json > ../reports/security/npm-audit.json

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-reports
          path: reports/security
          retention-days: 14

      - name: Write dependency summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dependency Security"
            echo
            echo "- pip-audit ${PIP_AUDIT_VERSION}: backend dependency audit completed."
            echo "- npm audit: frontend audit completed with critical severity gating."
          } >> "$GITHUB_STEP_SUMMARY"

  repository-config:
    name: Repository configuration scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "0"
          ignore-unfixed: true

      - name: Write configuration summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Repository Configuration Security"
            echo
            echo "- Trivy filesystem vulnerability, secret, and misconfiguration scan completed as a report-only advisory check."
            echo "- Gitleaks remains the blocking repository secret gate."
          } >> "$GITHUB_STEP_SUMMARY"
