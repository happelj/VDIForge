name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.15.0"
  ACTIONLINT_VERSION: "v1.7.7"

jobs:
  repository:
    name: Repository and workflow validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}

      - name: Validate GitHub Actions workflows
        run: actionlint

      - name: Validate Phase 1 repository foundation
        shell: pwsh
        run: ./scripts/validate-phase1.ps1

      - name: Validate Phase 13 CI policy
        shell: pwsh
        run: ./scripts/validate-phase13.ps1

      - name: Validate image catalog
        run: python scripts/validate-image-catalog.py

      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Repository CI"
            echo
            echo "- Phase 1 repository validation: completed"
            echo "- Phase 13 CI policy validation: completed"
            echo "- GitHub Actions syntax validation: completed"
            echo "- Image catalog validation: completed"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend lint, tests, and migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: vdiforge
          POSTGRES_USER: vdiforge
          POSTGRES_PASSWORD: vdiforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vdiforge -d vdiforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: vdiforge
      POSTGRES_USER: vdiforge
      POSTGRES_PASSWORD: vdiforge
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Lint backend
        working-directory: backend
        run: python -m ruff check .

      - name: Test backend
        working-directory: backend
        run: python -m pytest

      - name: Validate Alembic migrations
        working-directory: backend
        shell: bash
        run: |
          export VDIFORGE_DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}"
          python -m alembic upgrade head

      - name: Write backend summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Backend CI"
            echo
            echo "- Python: ${PYTHON_VERSION}"
            echo "- Ruff, pytest, and Alembic migration validation completed."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Write frontend summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Frontend CI"
            echo
            echo "- Node.js: ${NODE_VERSION}"
            echo "- npm ci, lint, unit/component tests, and production build completed."
            echo "- Live-lab browser E2E remains a manual/local validation path."
          } >> "$GITHUB_STEP_SUMMARY"
