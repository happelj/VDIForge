---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vdiforge-provisioner
  namespace: vdiforge-system
  labels:
    app.kubernetes.io/name: vdiforge-provisioner
    app.kubernetes.io/part-of: vdiforge
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vdiforge-provisioner-vdi-manager
  namespace: vdiforge-desktops
  labels:
    app.kubernetes.io/name: vdiforge-provisioner
    app.kubernetes.io/part-of: vdiforge
rules:
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datavolumes
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - services
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vdiforge-provisioner-vdi-manager
  namespace: vdiforge-desktops
  labels:
    app.kubernetes.io/name: vdiforge-provisioner
    app.kubernetes.io/part-of: vdiforge
subjects:
  - kind: ServiceAccount
    name: vdiforge-provisioner
    namespace: vdiforge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vdiforge-provisioner-vdi-manager
