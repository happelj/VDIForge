apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: __DATAVOLUME_NAME__
  namespace: vdiforge-desktops
  labels:
    app.kubernetes.io/name: phase6-ubuntu-devops
    app.kubernetes.io/part-of: vdiforge
    vdiforge.io/phase: "6"
    vdiforge.io/test: golden-image
spec:
  source:
    http:
      url: "__IMAGE_URL__"
      checksum: "sha256:__IMAGE_SHA256__"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: __STORAGE_SIZE__
    storageClassName: vdiforge-local-path
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __VM_NAME__
  namespace: vdiforge-desktops
  labels:
    app.kubernetes.io/name: phase6-ubuntu-devops
    app.kubernetes.io/part-of: vdiforge
    vdiforge.io/phase: "6"
    vdiforge.io/test: golden-image
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase6-ubuntu-devops
        app.kubernetes.io/part-of: vdiforge
        vdiforge.io/phase: "6"
        vdiforge.io/test: golden-image
    spec:
      nodeSelector:
        vdiforge.io/node-role: vdi
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: __DATAVOLUME_NAME__
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: __TEST_USER__
                  groups:
                    - sudo
                  shell: /bin/bash
                  lock_passwd: true
                  sudo:
                    - ALL=(ALL) NOPASSWD:ALL
                  ssh_authorized_keys:
                    - __SSH_PUBLIC_KEY__
              ssh_pwauth: false
              disable_root: true
