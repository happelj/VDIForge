apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: phase3-cirros
  namespace: vdiforge-desktops
  labels:
    app.kubernetes.io/name: phase3-cirros
    app.kubernetes.io/part-of: vdiforge
    vdiforge.io/phase: "3"
    vdiforge.io/test: kubevirt-foundation
spec:
  runStrategy: Halted
  dataVolumeTemplates:
    - metadata:
        name: phase3-cirros-dv
        labels:
          app.kubernetes.io/name: phase3-cirros
          app.kubernetes.io/part-of: vdiforge
          vdiforge.io/phase: "3"
      spec:
        source:
          http:
            url: "https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: vdiforge-local-path
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase3-cirros
        app.kubernetes.io/part-of: vdiforge
        vdiforge.io/phase: "3"
        vdiforge.io/test: kubevirt-foundation
    spec:
      nodeSelector:
        vdiforge.io/node-role: vdi
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 256Mi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: phase3-cirros-dv
