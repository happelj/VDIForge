platformConfig:
  validationMarker: phase9-react-self-service-portal

frontend:
  enabled: true
  image:
    tag: "0.9.0"
  ingress:
    enabled: true
    host: vdiforge.local
    tlsSecretName: vdiforge-portal-tls

api:
  image:
    tag: "0.9.0"
  env:
    corsAllowedOrigins: '["https://vdiforge.local"]'

provisioner:
  image:
    tag: "0.9.0"

networkPolicy:
  system:
    allowIngressToFrontend:
      enabled: true
