{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vdiforge.frontend.name" . }}-runtime-config
  namespace: {{ include "vdiforge.namespace.system" . }}
  labels:
    {{- include "vdiforge.frontend.labels" . | nindent 4 }}
data:
  runtime-config.js: |
    window.__VDIFORGE_CONFIG__ = {{ dict
      "apiBaseUrl" .Values.frontend.config.apiBaseUrl
      "oidcAuthority" .Values.frontend.config.oidcAuthority
      "oidcClientId" .Values.frontend.config.oidcClientId
      "oidcRedirectUri" .Values.frontend.config.oidcRedirectUri
      "oidcPostLogoutRedirectUri" .Values.frontend.config.oidcPostLogoutRedirectUri
      "sessionPollIntervalMs" .Values.frontend.config.sessionPollIntervalMs
    | toJson }};
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vdiforge.frontend.name" . }}
  namespace: {{ include "vdiforge.namespace.system" . }}
  labels:
    {{- include "vdiforge.frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vdiforge.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vdiforge.frontend.name" . }}
  namespace: {{ include "vdiforge.namespace.system" . }}
  labels:
    {{- include "vdiforge.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "vdiforge.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vdiforge.frontend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vdiforge.serviceAccount.frontendName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.frontend.automountServiceAccountToken }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.placement.platform.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.platform.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.platform.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/runtime-config.js
              subPath: runtime-config.js
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "vdiforge.frontend.name" . }}-runtime-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- if .Values.frontend.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vdiforge.frontend.name" . }}
  namespace: {{ include "vdiforge.namespace.system" . }}
  labels:
    {{- include "vdiforge.frontend.labels" . | nindent 4 }}
  {{- $middleware := include "vdiforge.securityMiddlewareRef" (list . "frontend") }}
  {{- if $middleware }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $middleware | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.frontend.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.frontend.ingress.host }}
      secretName: {{ .Values.frontend.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.frontend.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vdiforge.frontend.name" . }}
                port:
                  name: http
{{- end }}
{{- end }}
