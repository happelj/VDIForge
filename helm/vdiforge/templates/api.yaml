{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vdiforge.api.name" . }}
  namespace: {{ include "vdiforge.namespace.system" . }}
  labels:
    {{- include "vdiforge.api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vdiforge.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vdiforge.api.name" . }}
  namespace: {{ include "vdiforge.namespace.system" . }}
  labels:
    {{- include "vdiforge.api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vdiforge.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $apiDbSecretChecksum := include "vdiforge.secretChecksum" (list (include "vdiforge.namespace.system" .) .Values.api.env.databaseSecretName .Values.api.env.databasePasswordKey) }}
      {{- $guacamoleJsonSecretChecksum := include "vdiforge.secretChecksum" (list (include "vdiforge.namespace.system" .) .Values.api.env.guacamoleJsonSecretName .Values.api.env.guacamoleJsonSecretKey) }}
      {{- if or $apiDbSecretChecksum $guacamoleJsonSecretChecksum }}
      annotations:
        {{- if $apiDbSecretChecksum }}
        checksum/vdiforge-app-secrets: {{ $apiDbSecretChecksum | quote }}
        {{- end }}
        {{- if $guacamoleJsonSecretChecksum }}
        checksum/vdiforge-guacamole-json-secret: {{ $guacamoleJsonSecretChecksum | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "vdiforge.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vdiforge.serviceAccount.apiName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.api.automountServiceAccountToken }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.placement.platform.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.platform.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.platform.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: VDIFORGE_SERVICE_NAME
              value: vdiforge-api
            - name: VDIFORGE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.env.databaseSecretName }}
                  key: {{ .Values.api.env.databasePasswordKey }}
            - name: VDIFORGE_DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.api.env.databaseUser }}:$(VDIFORGE_DATABASE_PASSWORD)@{{ include "vdiforge.appDatabase.name" . }}.{{ include "vdiforge.namespace.system" . }}.svc.cluster.local:5432/{{ .Values.api.env.databaseName }}"
            - name: VDIFORGE_KEYCLOAK_ISSUER
              value: {{ .Values.api.env.keycloakIssuer | quote }}
            - name: VDIFORGE_KEYCLOAK_JWKS_URL
              value: {{ .Values.api.env.keycloakJwksUrl | quote }}
            - name: VDIFORGE_JWT_AUDIENCE
              value: {{ .Values.api.env.jwtAudience | quote }}
            - name: VDIFORGE_KEYCLOAK_CA_FILE
              value: /var/run/vdiforge/keycloak-ca/{{ .Values.api.env.keycloakCaKey }}
            - name: VDIFORGE_IMAGE_CATALOG_PATH
              value: {{ .Values.api.env.imageCatalogPath | quote }}
            - name: VDIFORGE_DESKTOPS_NAMESPACE
              value: {{ .Values.api.env.desktopsNamespace | quote }}
            - name: VDIFORGE_GUACAMOLE_BASE_URL
              value: {{ .Values.api.env.guacamoleBaseUrl | quote }}
            - name: VDIFORGE_GUACAMOLE_JSON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.env.guacamoleJsonSecretName }}
                  key: {{ .Values.api.env.guacamoleJsonSecretKey }}
            - name: VDIFORGE_REMOTE_SESSION_TTL_SECONDS
              value: {{ .Values.api.env.remoteSessionTtlSeconds | quote }}
            - name: VDIFORGE_REMOTE_DESKTOP_PROTOCOL
              value: {{ .Values.api.env.remoteDesktopProtocol | quote }}
            - name: VDIFORGE_REMOTE_DESKTOP_PORT
              value: {{ .Values.api.env.remoteDesktopPort | quote }}
            - name: VDIFORGE_GUACAMOLE_RDP_SECURITY
              value: {{ .Values.api.env.guacamoleRdpSecurity | quote }}
            - name: VDIFORGE_GUACAMOLE_RDP_SERVER_LAYOUT
              value: {{ .Values.api.env.guacamoleRdpServerLayout | quote }}
            - name: VDIFORGE_CORS_ALLOWED_ORIGINS
              value: {{ .Values.api.env.corsAllowedOrigins | quote }}
            - name: VDIFORGE_LOAD_TEST_ENABLED
              value: {{ .Values.api.loadTest.enabled | quote }}
            - name: VDIFORGE_LOAD_TEST_DEFAULT_ITERATIONS
              value: {{ .Values.api.loadTest.defaultIterations | quote }}
            - name: VDIFORGE_LOAD_TEST_MAX_ITERATIONS
              value: {{ .Values.api.loadTest.maxIterations | quote }}
            - name: VDIFORGE_METRICS_ENABLED
              value: {{ .Values.monitoring.applicationMetrics.enabled | quote }}
            - name: VDIFORGE_METRICS_PORT
              value: {{ .Values.monitoring.applicationMetrics.provisionerPort | quote }}
            - name: VDIFORGE_API_RATE_LIMIT_ENABLED
              value: {{ .Values.api.rateLimit.enabled | quote }}
            - name: VDIFORGE_DESKTOP_MUTATION_RATE_LIMIT
              value: {{ .Values.api.rateLimit.desktopMutation.limit | quote }}
            - name: VDIFORGE_DESKTOP_MUTATION_RATE_WINDOW_SECONDS
              value: {{ .Values.api.rateLimit.desktopMutation.windowSeconds | quote }}
            - name: VDIFORGE_DESKTOP_CONNECT_RATE_LIMIT
              value: {{ .Values.api.rateLimit.desktopConnect.limit | quote }}
            - name: VDIFORGE_DESKTOP_CONNECT_RATE_WINDOW_SECONDS
              value: {{ .Values.api.rateLimit.desktopConnect.windowSeconds | quote }}
          volumeMounts:
            - name: keycloak-ca
              mountPath: /var/run/vdiforge/keycloak-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: keycloak-ca
          secret:
            secretName: {{ .Values.api.env.keycloakCaSecretName }}
        - name: tmp
          emptyDir: {}
---
{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vdiforge.api.name" . }}
  namespace: {{ include "vdiforge.namespace.system" . }}
  labels:
    {{- include "vdiforge.api.labels" . | nindent 4 }}
  {{- $middleware := include "vdiforge.securityMiddlewareRef" (list . "api") }}
  {{- if $middleware }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $middleware | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.api.ingress.host }}
      secretName: {{ .Values.api.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vdiforge.api.name" . }}
                port:
                  name: http
{{- end }}
{{- end }}
