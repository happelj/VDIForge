global:
  labels: {}

helm:
  testedVersion: "v4.2.4"

namespaces:
  create: false
  system: vdiforge-system
  desktops: vdiforge-desktops
  identity: keycloak
  remoteAccess: guacamole
  monitoring: monitoring

platformConfig:
  enabled: true
  environment: local
  validationMarker: phase4-baseline
  kubernetesVersion: "v1.36.4"
  storageClass: vdiforge-local-path

serviceAccounts:
  enabled: true
  api:
    create: true
    name: vdiforge-api
    automountServiceAccountToken: false
  provisioner:
    create: true
    name: vdiforge-provisioner
    automountServiceAccountToken: true

rbac:
  enabled: true
  provisioner:
    enabled: true
    roleName: vdiforge-provisioner-vdi-manager

resourceGovernance:
  enabled: true
  quotas:
    system:
      enabled: true
      name: vdiforge-system-quota
      hard:
        pods: "20"
        services: "20"
        configmaps: "40"
        secrets: "40"
        requests.cpu: "1500m"
        requests.memory: "3Gi"
        limits.cpu: "3"
        limits.memory: "5Gi"
    desktops:
      enabled: true
      name: vdiforge-desktops-quota
      hard:
        pods: "20"
        services: "40"
        persistentvolumeclaims: "10"
        requests.storage: "80Gi"
        requests.cpu: "6"
        requests.memory: "12Gi"
        limits.cpu: "8"
        limits.memory: "16Gi"
        count/virtualmachines.kubevirt.io: "4"
        count/virtualmachineinstances.kubevirt.io: "4"
        count/datavolumes.cdi.kubevirt.io: "8"
    identity:
      enabled: false
      name: vdiforge-identity-quota
      hard:
        pods: "8"
        services: "6"
        configmaps: "12"
        secrets: "16"
        persistentvolumeclaims: "2"
        requests.storage: "10Gi"
        requests.cpu: "1200m"
        requests.memory: "3Gi"
        limits.cpu: "2500m"
        limits.memory: "4Gi"
  limitRanges:
    system:
      enabled: true
      name: vdiforge-system-defaults
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi

networkPolicy:
  enabled: true
  system:
    defaultDeny:
      enabled: true
      name: vdiforge-system-default-deny
    allowDns:
      enabled: true
      name: vdiforge-system-allow-dns
    allowProvisionerKubernetesApi:
      enabled: true
      name: vdiforge-system-provisioner-kubernetes-api
      apiServerCidr: 10.96.0.1/32
      apiServerPort: 443

placement:
  platform:
    nodeSelector:
      vdiforge.io/node-role: platform
    tolerations: []
    affinity: {}
  vdi:
    nodeSelector:
      vdiforge.io/node-role: vdi
    tolerations: []
    affinity: {}

ingress:
  enabled: false
  className: ""
  hosts:
    portal: vdiforge.local
    auth: auth.vdiforge.local
    grafana: grafana.vdiforge.local
  tls:
    enabled: false

frontend:
  enabled: false
  image:
    repository: ""
    tag: ""
  resources: {}
  autoscaling:
    enabled: false

api:
  enabled: false
  image:
    repository: ""
    tag: ""
  resources: {}
  autoscaling:
    enabled: false

provisioner:
  enabled: false
  image:
    repository: ""
    tag: ""
  resources: {}
  autoscaling:
    enabled: false

keycloak:
  enabled: false
  managedByChart: true
  name: vdiforge-keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.7.2"
    pullPolicy: IfNotPresent
  replicas: 1
  existingSecret: vdiforge-keycloak-secrets
  realmImportConfigMap: vdiforge-keycloak-realm
  realmImportFile: vdiforge-realm.json
  admin:
    usernameKey: KEYCLOAK_ADMIN_USERNAME
    passwordKey: KEYCLOAK_ADMIN_PASSWORD
  database:
    host: vdiforge-keycloak-postgres
    port: 5432
    name: keycloak
    username: keycloak
    passwordKey: KEYCLOAK_DB_PASSWORD
  hostname: https://auth.vdiforge.local
  httpEnabled: true
  proxyHeaders: xforwarded
  proxyTrustedAddresses: "10.244.0.0/16,192.168.56.0/24"
  cache: local
  healthEnabled: true
  metricsEnabled: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  service:
    port: 8080
    managementPort: 9000
  ingress:
    enabled: false
    className: traefik
    host: auth.vdiforge.local
    tlsSecretName: vdiforge-keycloak-tls
  postgresql:
    enabled: true
    name: vdiforge-keycloak-postgres
    image:
      repository: postgres
      tag: "18.0-alpine"
      pullPolicy: IfNotPresent
    storageClassName: vdiforge-local-path
    storageSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  networkPolicy:
    enabled: true
    defaultDeny:
      name: keycloak-default-deny
    allowDns:
      name: keycloak-allow-dns
    allowIngressToKeycloak:
      name: keycloak-allow-ingress-controller
      namespace: ingress-traefik
      podSelector:
        app.kubernetes.io/name: traefik
    allowKeycloakToPostgres:
      name: keycloak-allow-keycloak-to-postgres
    allowPostgresFromKeycloak:
      name: keycloak-allow-postgres-from-keycloak
    allowFutureApiToKeycloak:
      enabled: true
      name: keycloak-allow-future-api
      namespace: vdiforge-system
      podSelector:
        app.kubernetes.io/component: api

guacamole:
  enabled: false
  externalChart: true

monitoring:
  enabled: false
  externalChart: true
