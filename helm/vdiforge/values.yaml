global:
  labels: {}

helm:
  testedVersion: "v4.2.4"

namespaces:
  create: false
  system: vdiforge-system
  desktops: vdiforge-desktops
  identity: keycloak
  remoteAccess: guacamole
  monitoring: monitoring

platformConfig:
  enabled: true
  environment: local
  validationMarker: phase4-baseline
  kubernetesVersion: "v1.36.4"
  storageClass: vdiforge-local-path

serviceAccounts:
  enabled: true
  api:
    create: true
    name: vdiforge-api
    automountServiceAccountToken: false
  frontend:
    create: true
    name: vdiforge-frontend
    automountServiceAccountToken: false
  provisioner:
    create: true
    name: vdiforge-provisioner
    automountServiceAccountToken: true
  database:
    create: true
    name: vdiforge-app-postgres
    automountServiceAccountToken: false

rbac:
  enabled: true
  provisioner:
    enabled: true
    roleName: vdiforge-provisioner-vdi-manager
  apiRemoteAccess:
    enabled: false
    roleName: vdiforge-api-remote-session-reader

resourceGovernance:
  enabled: true
  quotas:
    system:
      enabled: true
      name: vdiforge-system-quota
      hard:
        pods: "20"
        services: "20"
        configmaps: "40"
        secrets: "40"
        requests.cpu: "1500m"
        requests.memory: "3Gi"
        limits.cpu: "3"
        limits.memory: "5Gi"
    desktops:
      enabled: true
      name: vdiforge-desktops-quota
      hard:
        pods: "20"
        services: "40"
        persistentvolumeclaims: "10"
        requests.storage: "80Gi"
        requests.cpu: "6"
        requests.memory: "12Gi"
        limits.cpu: "8"
        limits.memory: "16Gi"
        count/virtualmachines.kubevirt.io: "4"
        count/virtualmachineinstances.kubevirt.io: "4"
        count/datavolumes.cdi.kubevirt.io: "8"
    identity:
      enabled: false
      name: vdiforge-identity-quota
      hard:
        pods: "8"
        services: "6"
        configmaps: "12"
        secrets: "16"
        persistentvolumeclaims: "2"
        requests.storage: "10Gi"
        requests.cpu: "1200m"
        requests.memory: "3Gi"
        limits.cpu: "2500m"
        limits.memory: "4Gi"
    remoteAccess:
      enabled: false
      name: guacamole-quota
      hard:
        pods: "10"
        services: "6"
        configmaps: "8"
        secrets: "12"
        requests.cpu: "800m"
        requests.memory: "1536Mi"
        limits.cpu: "3"
        limits.memory: "3Gi"
  limitRanges:
    system:
      enabled: true
      name: vdiforge-system-defaults
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
    remoteAccess:
      enabled: false
      name: guacamole-defaults
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 768Mi

networkPolicy:
  enabled: true
  system:
    defaultDeny:
      enabled: true
      name: vdiforge-system-default-deny
    allowDns:
      enabled: true
      name: vdiforge-system-allow-dns
    allowProvisionerKubernetesApi:
      enabled: true
      name: vdiforge-system-provisioner-kubernetes-api
      apiServerCidr: 10.96.0.1/32
      apiServerPort: 443
      endpoints:
        - cidr: 10.96.0.1/32
          port: 443
        - cidr: 192.168.56.10/32
          port: 6443
    allowProvisionerRemoteDesktop:
      enabled: false
      name: vdiforge-system-provisioner-to-desktop-rdp
      desktopNamespace: vdiforge-desktops
      desktopPodSelector:
        app.kubernetes.io/component: desktop-vm
      port: 3389
    allowApiKubernetesApi:
      enabled: false
      name: vdiforge-system-api-kubernetes-api
      endpoints:
        - cidr: 10.96.0.1/32
          port: 443
        - cidr: 192.168.56.10/32
          port: 6443
    allowIngressToApi:
      enabled: false
      name: vdiforge-system-allow-api-ingress
      namespace: ingress-traefik
      podSelector:
        app.kubernetes.io/name: traefik
      port: 8000
    allowIngressToFrontend:
      enabled: false
      name: vdiforge-system-allow-frontend-ingress
      namespace: ingress-traefik
      podSelector:
        app.kubernetes.io/name: traefik
      port: 8080
    allowApiToKeycloak:
      enabled: false
      name: vdiforge-system-api-to-keycloak
      namespace: keycloak
      podSelector:
        app.kubernetes.io/component: identity
      port: 8080
    allowAppDatabase:
      enabled: false
      clientEgressName: vdiforge-system-app-to-app-postgres
      databaseName: vdiforge-system-app-postgres-ingress
      port: 5432

placement:
  platform:
    nodeSelector:
      vdiforge.io/node-role: platform
    tolerations: []
    affinity: {}
  vdi:
    nodeSelector:
      vdiforge.io/node-role: vdi
    tolerations: []
    affinity: {}

ingress:
  enabled: false
  className: ""
  hosts:
    portal: vdiforge.local
    auth: auth.vdiforge.local
    api: api.vdiforge.local
    grafana: grafana.vdiforge.local
  tls:
    enabled: false
    apiSecretName: vdiforge-api-tls

frontend:
  enabled: false
  name: vdiforge-frontend
  image:
    repository: localhost/vdiforge-frontend
    tag: "0.9.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8080
  config:
    apiBaseUrl: https://api.vdiforge.local
    oidcAuthority: https://auth.vdiforge.local/realms/vdiforge
    oidcClientId: vdiforge-frontend
    oidcRedirectUri: https://vdiforge.local/oidc/callback
    oidcPostLogoutRedirectUri: https://vdiforge.local/
    sessionPollIntervalMs: 5000
  ingress:
    enabled: false
    className: traefik
    host: vdiforge.local
    tlsSecretName: vdiforge-portal-tls
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false

api:
  enabled: false
  image:
    repository: localhost/vdiforge-api
    tag: "0.9.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    name: vdiforge-api
    port: 8000
  env:
    databaseSecretName: vdiforge-app-secrets
    databasePasswordKey: VDIFORGE_APP_DB_PASSWORD
    keycloakCaSecretName: vdiforge-api-keycloak-ca
    keycloakCaKey: vdiforge-local-ca.crt
    keycloakIssuer: https://auth.vdiforge.local/realms/vdiforge
    keycloakJwksUrl: http://vdiforge-keycloak.keycloak.svc.cluster.local:8080/realms/vdiforge/protocol/openid-connect/certs
    jwtAudience: vdiforge-api
    imageCatalogPath: /app/images/catalog.json
    databaseName: vdiforge
    databaseUser: vdiforge
    desktopsNamespace: vdiforge-desktops
    guacamoleBaseUrl: https://remote.vdiforge.local
    guacamoleJsonSecretName: vdiforge-guacamole-json-secret
    guacamoleJsonSecretKey: JSON_SECRET_KEY
    corsAllowedOrigins: '["https://vdiforge.local"]'
    remoteSessionTtlSeconds: "300"
    remoteDesktopProtocol: rdp
    remoteDesktopPort: "3389"
    guacamoleRdpSecurity: any
    guacamoleRdpServerLayout: en-us-qwerty
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  ingress:
    enabled: false
    className: traefik
    host: api.vdiforge.local
    tlsSecretName: vdiforge-api-tls

provisioner:
  enabled: false
  image:
    repository: localhost/vdiforge-api
    tag: "0.9.0"
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    databaseSecretName: vdiforge-app-secrets
    databasePasswordKey: VDIFORGE_APP_DB_PASSWORD
    keycloakCaSecretName: vdiforge-api-keycloak-ca
    keycloakCaKey: vdiforge-local-ca.crt
    keycloakIssuer: https://auth.vdiforge.local/realms/vdiforge
    keycloakJwksUrl: http://vdiforge-keycloak.keycloak.svc.cluster.local:8080/realms/vdiforge/protocol/openid-connect/certs
    jwtAudience: vdiforge-api
    imageCatalogPath: /app/images/catalog.json
    databaseName: vdiforge
    databaseUser: vdiforge
    maxDesktopsPerUser: "1"
    maxDesktopsPerAdmin: "3"
    desktopsNamespace: vdiforge-desktops
    storageClass: vdiforge-local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false

applicationDatabase:
  enabled: false
  name: vdiforge-app-postgres
  image:
    repository: postgres
    tag: "18.0-alpine"
    pullPolicy: IfNotPresent
  existingSecret: vdiforge-app-secrets
  passwordKey: VDIFORGE_APP_DB_PASSWORD
  database: vdiforge
  username: vdiforge
  storageClassName: vdiforge-local-path
  storageSize: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

migrations:
  enabled: false
  name: vdiforge-api-migrations
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600

keycloak:
  enabled: false
  managedByChart: true
  name: vdiforge-keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.7.2"
    pullPolicy: IfNotPresent
  replicas: 1
  existingSecret: vdiforge-keycloak-secrets
  realmImportConfigMap: vdiforge-keycloak-realm
  realmImportFile: vdiforge-realm.json
  admin:
    usernameKey: KEYCLOAK_ADMIN_USERNAME
    passwordKey: KEYCLOAK_ADMIN_PASSWORD
  database:
    host: vdiforge-keycloak-postgres
    port: 5432
    name: keycloak
    username: keycloak
    passwordKey: KEYCLOAK_DB_PASSWORD
  hostname: https://auth.vdiforge.local
  httpEnabled: true
  proxyHeaders: xforwarded
  proxyTrustedAddresses: "10.244.0.0/16,192.168.56.0/24"
  cache: local
  healthEnabled: true
  metricsEnabled: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  service:
    port: 8080
    managementPort: 9000
  ingress:
    enabled: false
    className: traefik
    host: auth.vdiforge.local
    tlsSecretName: vdiforge-keycloak-tls
  postgresql:
    enabled: true
    name: vdiforge-keycloak-postgres
    volumeClaimTemplateLabels: {}
    image:
      repository: postgres
      tag: "18.0-alpine"
      pullPolicy: IfNotPresent
    storageClassName: vdiforge-local-path
    storageSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  networkPolicy:
    enabled: true
    defaultDeny:
      name: keycloak-default-deny
    allowDns:
      name: keycloak-allow-dns
    allowIngressToKeycloak:
      name: keycloak-allow-ingress-controller
      namespace: ingress-traefik
      podSelector:
        app.kubernetes.io/name: traefik
    allowKeycloakToPostgres:
      name: keycloak-allow-keycloak-to-postgres
    allowPostgresFromKeycloak:
      name: keycloak-allow-postgres-from-keycloak
    allowFutureApiToKeycloak:
      enabled: true
      name: keycloak-allow-future-api
      namespace: vdiforge-system
      podSelector:
        app.kubernetes.io/component: api

guacamole:
  enabled: false
  name: vdiforge-guacamole
  guacd:
    name: vdiforge-guacd
    image:
      repository: guacamole/guacd
      tag: "1.6.0"
      pullPolicy: IfNotPresent
    service:
      port: 4822
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  image:
    repository: guacamole/guacamole
    tag: "1.6.0"
    pullPolicy: IfNotPresent
  replicas: 1
  existingJsonSecret: vdiforge-guacamole-json-secret
  jsonSecretKey: JSON_SECRET_KEY
  service:
    port: 8080
  ingress:
    enabled: false
    className: traefik
    host: remote.vdiforge.local
    tlsSecretName: vdiforge-guacamole-tls
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi
  networkPolicy:
    enabled: true
    defaultDeny:
      name: guacamole-default-deny
    allowDns:
      name: guacamole-allow-dns
    allowIngressToWeb:
      name: guacamole-allow-ingress-controller
      namespace: ingress-traefik
      podSelector:
        app.kubernetes.io/name: traefik
    allowWebToGuacd:
      egressName: guacamole-web-to-guacd
      ingressName: guacamole-guacd-from-web
    allowGuacdToDesktops:
      name: guacamole-guacd-to-vdi-rdp
      desktopNamespace: vdiforge-desktops
      desktopPodSelector:
        app.kubernetes.io/component: desktop-vm
      port: 3389

monitoring:
  enabled: false
  externalChart: true
