---
- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: vdiforge_kubernetes_admin_conf

- name: Write kubeadm init configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - /etc/kubernetes/kubeadm-init.yaml
  when: not vdiforge_kubernetes_admin_conf.stat.exists
  register: vdiforge_kubeadm_init
  no_log: true
  changed_when: true

- name: Ensure admin kubeconfig directory exists for lab administrator
  ansible.builtin.file:
    path: "/home/{{ vdiforge_admin_user }}/.kube"
    state: directory
    owner: "{{ vdiforge_admin_user }}"
    group: "{{ vdiforge_admin_user }}"
    mode: "0700"

- name: Install admin kubeconfig for lab administrator
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ vdiforge_admin_user }}/.kube/config"
    remote_src: true
    owner: "{{ vdiforge_admin_user }}"
    group: "{{ vdiforge_admin_user }}"
    mode: "0600"

- name: Wait for Kubernetes API to answer on the control plane
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - nodes
  register: vdiforge_kubectl_nodes
  changed_when: false
  retries: 30
  delay: 10
  until: vdiforge_kubectl_nodes.rc == 0
