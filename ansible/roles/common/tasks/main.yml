---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure hostname is present in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1\\s+"
    line: "127.0.1.1 {{ inventory_hostname }} {{ inventory_hostname }}.{{ vdiforge_lab_domain }}"
    owner: root
    group: root
    mode: "0644"

- name: Update apt metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common baseline packages
  ansible.builtin.apt:
    name: "{{ vdiforge_common_packages }}"
    state: present

- name: Ensure OpenSSH server is enabled
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started

- name: Ensure systemd-timesyncd is enabled when present
  ansible.builtin.service:
    name: systemd-timesyncd
    enabled: true
    state: started
  failed_when: false

- name: Disable active swap for future Kubernetes compatibility
  ansible.builtin.command: swapoff -a
  when:
    - vdiforge_manage_swap_for_kubernetes_prereq
    - ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap entries in /etc/fstab for future Kubernetes compatibility
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#]\S+\s+\S+\s+swap\s+\S+\s+\S+\s+\S+)$'
    replace: '# \1'
  when: vdiforge_manage_swap_for_kubernetes_prereq
