---
- name: Ensure root SSH login policy is explicit
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin\s+'
    line: "PermitRootLogin {{ vdiforge_ssh_permit_root_login }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure SSH password authentication policy is explicit for lab bootstrap
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication\s+'
    line: "PasswordAuthentication {{ 'yes' if vdiforge_ssh_password_authentication else 'no' }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure public key authentication is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PubkeyAuthentication\s+'
    line: "PubkeyAuthentication yes"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure administrative user is in sudo group
  ansible.builtin.user:
    name: "{{ vdiforge_admin_user }}"
    groups: sudo
    append: true

- name: Ensure sudo group exists in sudoers
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^%sudo\s+'
    line: '%sudo ALL=(ALL:ALL) ALL'
    validate: /usr/sbin/visudo -cf %s
