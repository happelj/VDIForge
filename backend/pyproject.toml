[project]
name = "vdiforge-backend"
version = "0.12.0"
description = "FastAPI VDI control plane, KubeVirt provisioner, Guacamole session broker, portal API support, HPA load-test support, Prometheus metrics, and security hardening for VDIForge Phase 12."
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "PyJWT[crypto]==2.13.0",
    "cryptography==50.0.1",
    "kubernetes==36.0.3",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
