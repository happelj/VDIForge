[project]
name = "vdiforge-backend"
version = "0.14.0"
description = "FastAPI VDI control plane, KubeVirt provisioner, Guacamole session broker, portal API support, HPA load-test support, Prometheus metrics, security hardening, and final demo catalog metadata for VDIForge."
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.2",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
    "kubernetes==36.0.3",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
